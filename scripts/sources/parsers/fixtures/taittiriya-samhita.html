<section class="anuvaka-section" id="anuvaka-1">
<div class="anuvaka-content"><span class="pancashati-text" id="anuvaka-1-pancashati-1" data-iso="x"><span class="script-devanagari">नम॑स्ते रुद्र म॒न्यव॑ उ॒तो त॒ इष॑वे॒ नमः॑⁠। नम॑स्ते अस्तु॒ धन्व॑ने॒ नमः॑⁠॥ यामिषु॑ङ्गिरिशन्त॒ हस्ते॒</span><span class="script-kannada" style="display:none;">ನಮ॑ಸ್ತೇ</span><span class="script-grantha" style="display:none;">𑌨𑌮॑𑌸𑍍𑌤𑍇</span> <span class="pancashati-reading" title="Reading"><span class="script-devanagari">(हस्ते᳚)</span><span class="script-kannada" style="display:none;">(ಹಸ್ತೇ᳚)</span></span></span>
<span class="pancashati-text" id="anuvaka-1-pancashati-2" data-iso="y"><span class="script-devanagari">ये चे॒माꣳ रु॒द्रा अ॒भितो॑ दि॒क्षु॒&amp; श्रि॒ताः स॑ह॒स्रशो॑ऽवै॑षा॒ꣳ॒ हेड॑ ईमहे⁠॥</span><span class="script-kannada" style="display:none;">ಯೇ</span></span></div>
</section>
